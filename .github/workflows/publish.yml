# Auto-release zoreal/oauth2 on every push to main, the family pattern set by
# zoreal-oauth2-react: bump the patch in composer.json, run the tests, push
# the bump commit and tag back to main, and cut the GitHub release. There is
# no registry upload step, because Packagist does not take uploads: it reads
# this repository's tags. One-time setup: submit the repository URL at
# packagist.org/packages/submit and enable the GitHub hook (automatic when
# Packagist is linked to the GitHub account), after which every tag this
# workflow pushes appears on Packagist by itself.
#
# To ship without cutting a release (docs, CI tweaks), put [skip publish] in
# the commit message.
name: Release for Packagist

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip publish]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT=$(php -r 'echo json_decode(file_get_contents("composer.json"))->version;')
          NEW="${CURRENT%.*}.$(( ${CURRENT##*.} + 1 ))"
          sed -i "s/\"version\": \"${CURRENT}\"/\"version\": \"${NEW}\"/" composer.json
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - run: composer install --no-progress
      - run: vendor/bin/phpunit

      - run: |
          git add composer.json
          git commit -m "Release v${{ steps.bump.outputs.version }} [skip publish]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main "v${{ steps.bump.outputs.version }}"

      - run: gh release create "v${{ steps.bump.outputs.version }}" --title "v${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # Tell Packagist directly, rather than waiting on the GitHub-app sync.
      # PACKAGIST_USERNAME is a repository variable, the safe token a secret;
      # while either is unset the step skips rather than failing the release.
      - run: |
          if [ -z "${PACKAGIST_USERNAME}" ] || [ -z "${PACKAGIST_SAFE_TOKEN}" ]; then
            echo "Packagist credentials not configured; relying on the GitHub-app sync."
            exit 0
          fi
          curl -sf -X POST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_SAFE_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"repository":{"url":"https://github.com/Bynn-Intelligence/zoreal-oauth2-php"}}'
        env:
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          PACKAGIST_SAFE_TOKEN: ${{ secrets.PACKAGIST_SAFE_TOKEN }}
